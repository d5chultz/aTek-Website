<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Boobs of the Day | Analog Tech Foundry</title>
    <meta name="theme-color" content="#161618">
    <link rel="stylesheet" href="warm.css">
    <style>
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; background: #161618; }
        .egg-head { text-align: center; padding: clamp(18px, 4vh, 40px) 16px 12px; padding-top: calc(clamp(18px, 4vh, 40px) + env(safe-area-inset-top)); }
        .egg-head h1 { font: 600 clamp(1.6rem, 4.2vw, 3rem) 'Outfit', var(--font-head); letter-spacing: 0.02em; text-transform: uppercase; }
        .egg-head p { margin-top: 6px; font-size: 0.66rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--amber); }
        .egg-stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px clamp(12px, 4vw, 48px); }
        .egg-stage .bezel { max-width: 100%; max-height: 100%; display: flex; }
        .egg-stage img { display: block; max-width: 100%; max-height: calc(100vh - 230px); width: auto; height: auto; object-fit: contain; border-radius: 4px; }
        .egg-foot { display: flex; justify-content: center; gap: 8px; padding: 14px 12px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
        .egg-msg { color: var(--alu-dim); font-size: 0.8rem; letter-spacing: 0.1em; }
    </style>
</head>
<body>
    <header class="egg-head">
        <h1>Boobs of the Day</h1>
        <p id="egg-date"></p>
    </header>

    <main class="egg-stage">
        <div class="bezel" id="egg-frame" hidden><img id="egg-img" alt="Photo of the day"></div>
        <div class="egg-msg" id="egg-msg">Loading&hellip;</div>
    </main>

    <footer class="egg-foot">
        <a class="atf-link primary" id="egg-back" href="tuner.html">&#9664; Back to radio</a>
        <a class="atf-link" href="index.html">Home</a>
    </footer>

    <script src="images/eggs/manifest.js"></script>
    <script>
    (function () {
        var DIR = 'images/eggs/';
        var list = (window.EGG_IMAGES || []).slice();

        function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
        function pickDaily(items, now) {
            if (!items.length) return null;
            var dayNumber = Math.floor((now.getTime() - now.getTimezoneOffset() * 60000) / 86400000);
            var cycle = Math.floor(dayNumber / items.length), pos = dayNumber % items.length;
            var rnd = mulberry(cycle * 2654435761 + 12345), order = items.slice();
            for (var i = order.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = order[i]; order[i] = order[j]; order[j] = t; }
            return order[pos];
        }

        var now = new Date();
        document.getElementById('egg-date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        var img = document.getElementById('egg-img'), frame = document.getElementById('egg-frame'), msg = document.getElementById('egg-msg');

        function displayDailyPhoto(pool) {
            var file = pickDaily(pool, now);
            if (!file) { msg.textContent = 'No photos found in images/eggs.'; return; }
            img.onload = function () { msg.style.display = 'none'; frame.hidden = false; };
            img.onerror = function () {
                // If this image was deleted, try the next one in the pool
                var nextPool = pool.filter(function (f) { return f !== file; });
                if (nextPool.length) displayDailyPhoto(nextPool);
                else msg.textContent = 'Could not load photo.';
            };
            img.src = DIR + encodeURIComponent(file);
        }

        // Dynamically fetch freshest manifest.json
        fetch('images/eggs/manifest.json?t=' + Date.now())
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (Array.isArray(data) && data.length) displayDailyPhoto(data);
                else displayDailyPhoto(list);
            })
            .catch(function () {
                displayDailyPhoto(list);
            });

        // Back: close this tab if the tuner opened it (keeps the radio tab and its audio untouched)
        document.getElementById('egg-back').addEventListener('click', function (e) {
            if (window.opener || history.length <= 1) { e.preventDefault(); window.close(); setTimeout(function () { location.href = 'tuner.html'; }, 300); }
        });
    })();
    </script>
</body>
</html>
